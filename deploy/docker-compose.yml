services:
  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/airlytics.db
    volumes:
      - airlytics_data:/app/data
    ports:
      - "8000:8000"

volumes:
  airlytics_data:
